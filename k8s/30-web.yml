---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storyfeta-web
spec:
  replicas: 2               # stateless: rooms live in Redis, sockets fan out via pub/sub
  selector:
    matchLabels:
      app: storyfeta-web
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: storyfeta-web
    spec:
      terminationGracePeriodSeconds: 15   # lets the app close WebSockets before SIGKILL
      containers:
      - name: web
        image: storyfeta:0.2
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: storyfeta-config
        - secretRef:
            name: storyfeta-secret
        ports:
        - containerPort: 8000
        # Readiness needs only Redis (/readyz): without Postgres games still work, just not
        # accounts/archive, so a DB outage must not take the whole site out of the Service.
        # Liveness only checks the port: a backing-service outage must not restart web pods.
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 8000
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        livenessProbe:
          failureThreshold: 3
          tcpSocket:
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 1
          initialDelaySeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storyfeta-web
spec:
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 30080
  selector:
    app: storyfeta-web
  type: NodePort
...
