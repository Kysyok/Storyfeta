---
# Dev-only values for minikube. Real secrets should not be committed:
#   kubectl create secret generic storyfeta-secret --from-literal=SECRET_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: storyfeta-secret
type: Opaque
stringData:
  SECRET_KEY: dev-only-secret-change-me-please-0123456789
  POSTGRES_USER: storyfeta
  POSTGRES_PASSWORD: storyfeta
  POSTGRES_DB: storyfeta
  DATABASE_URL: postgresql+asyncpg://storyfeta:storyfeta@postgres:5432/storyfeta
...
